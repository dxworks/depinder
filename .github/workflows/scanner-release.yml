name: Scanner Release

# Tags the next patch release after a bot bump, if nothing else is unreleased.

on:
  push:
    branches: [dev]
    paths:
      - packages/depinder-core/src/vuln/scanner-versions.ts

permissions:
  contents: read

concurrency:
  group: scanner-release
  cancel-in-progress: false

jobs:
  tag:
    if: startsWith(github.event.head_commit.message, 'Bump pinned scanners:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.SCANNER_BOT_TOKEN }}
          fetch-depth: 0

      - name: Tag next patch release
        run: |
          last="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)"
          [ -n "$last" ] || { echo "::error::no previous v* tag"; exit 1; }
          others="$(git log --format=%s "$last"..HEAD | grep -v '^Bump pinned scanners:' || true)"
          if [ -n "$others" ]; then
            echo "::notice::Not releasing: dev has unreleased changes besides scanner bumps:"
            echo "$others"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          next="v${major}.${minor}.$((patch + 1))"
          git tag "$next"
          git push origin "$next"
          echo "Tagged $next"
