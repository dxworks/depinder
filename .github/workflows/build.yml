on:
  push:
    branches:
      - "*"

name: Build & Test

jobs:
  release:
    name: Build And Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      # typecheck, lint, test, build, size guard and dependency check of every Nx project
      - name: Check and build
        run: |
          npm ci
          npm run check
        env:
#          GH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          CI: true


