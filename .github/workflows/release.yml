name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      semver: ${{ steps.parse.outputs.semver }}
    steps:
      - id: parse
        run: |
          semver="${TAG#v}"; semver="${semver%-voyager}"
          echo "semver=$semver" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.ref_name }}

  # Build, test and Trivy on the source; HIGH/CRITICAL stops everything below.
  gate:
    uses: dxworks/pipelines/.github/workflows/release-gate.yml@v1
    permissions:
      contents: read
      security-events: write
    with:
      node-version: '26.x'
      build-script: ./tools/release-build.sh

  # Trivy on the server image (its pinned Trivy and Grype included); HIGH/CRITICAL stops everything below.
  image-gate:
    uses: dxworks/pipelines/.github/workflows/trivy-image-scan.yml@v1
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      image-ref: depinder-server-test:latest
      build-setup: docker build -f packages/depinder-server/Dockerfile -t depinder-server-test:latest .
      fail-severity: HIGH,CRITICAL

  # Publishes ghcr.io/dxworks/depinder-server:<version> (amd64 + arm64).
  image:
    needs: [version, gate, image-gate]
    uses: dxworks/pipelines/.github/workflows/release-docker.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.version.outputs.semver }}
      image-name: dxworks/depinder-server
      dockerfile: packages/depinder-server/Dockerfile
      push-dockerhub: false
      push-ghcr: true

  # Switches the server to that image by digest (deploy/depinder-deploy.sh) and waits for health.
  deploy:
    needs: [version, image, Publish-and-Release]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: depinder-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve the image digest
        id: image
        run: |
          digest="$(docker buildx imagetools inspect "ghcr.io/dxworks/depinder-server:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for depinder-server:$VERSION"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ needs.version.outputs.semver }}

      - name: Deploy
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST" "deploy $VERSION $DIGEST"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          VERSION: ${{ needs.version.outputs.semver }}
          DIGEST: ${{ steps.image.outputs.digest }}

  Publish-and-Release:
    name: Publish NPM Package and Create Release
    needs: [gate, image-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract Semver
        id: semver_parser
        run: |
          semver=${TAG#"refs/tags/v"}
          semver=${semver%"-voyager"}
          
          echo ::set-output name=semver::$semver
        env:
          TAG: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'
          registry-url: 'https://registry.npmjs.org'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Npm CI
        run: npm ci

      # Before the build: the bundle inlines package.json, so `depinder --version` reads it from there.
      - name: Setup Version
        run: npm pkg set version="$VERSION" --workspace packages/depinder-cli
        env:
          VERSION: ${{ steps.semver_parser.outputs.semver }}

      - name: Build
        run: npx nx build depinder-cli --skip-nx-cache

      - name: Publish on NPM
        run: npm publish --access public --workspace packages/depinder-cli

      - name: Prepare Release Notes
        run: touch ${{ github.workspace }}/packages/depinder-cli/releaseNotes/v${{ steps.semver_parser.outputs.semver }}.md

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: Depinder ${{ steps.semver_parser.outputs.semver }}
          body_path: ${{ github.workspace }}/packages/depinder-cli/releaseNotes/v${{ steps.semver_parser.outputs.semver }}.md
          body: ""
          prerelease: false
          draft: false
          fail_on_unmatched_files: true
