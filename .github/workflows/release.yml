name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC
  contents: write

jobs:
  Publish-and-Release:
    name: Publish NPM Package and Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract Semver
        id: semver_parser
        run: |
          semver=${TAG#"refs/tags/v"}
          semver=${semver%"-voyager"}
          
          echo ::set-output name=semver::$semver
        env:
          TAG: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Npm CI
        run: npm ci

      # Before the build: the bundle inlines package.json, so `depinder --version` reads it from there.
      - name: Setup Version
        run: npm pkg set version="$VERSION" --workspace packages/depinder-cli
        env:
          VERSION: ${{ steps.semver_parser.outputs.semver }}

      - name: Build
        run: npx nx build depinder-cli --skip-nx-cache

      - name: Publish on NPM
        run: npm publish --access public --workspace packages/depinder-cli

      - name: Prepare Release Notes
        run: touch ${{ github.workspace }}/packages/depinder-cli/releaseNotes/v${{ steps.semver_parser.outputs.semver }}.md

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          name: Depinder ${{ steps.semver_parser.outputs.semver }}
          body_path: ${{ github.workspace }}/packages/depinder-cli/releaseNotes/v${{ steps.semver_parser.outputs.semver }}.md
          body: ""
          prerelease: false
          draft: false
          fail_on_unmatched_files: true
