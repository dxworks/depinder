name: Scanner Update

# Daily bump of the pinned scanners; needs secret SCANNER_BOT_TOKEN and auto-merge enabled.

on:
  schedule:
    - cron: '0 5 * * *'   # daily 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-update
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check bot token
        run: |
          if [ -z "${{ secrets.SCANNER_BOT_TOKEN }}" ]; then
            echo "::error::SCANNER_BOT_TOKEN is not set (see the header of this workflow)"; exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.SCANNER_BOT_TOKEN }}
          persist-credentials: false   # create-pull-request takes the token itself

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The pinned Trivy compares the vulnerabilities of the pinned and the candidate binaries.
      - name: Read the pinned Trivy
        id: pins
        run: |
          echo "trivy=$(sed -n "s/^ *trivy: '\(.*\)',$/\1/p" packages/depinder-core/src/vuln/scanner-versions.ts)" >> "$GITHUB_OUTPUT"

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ steps.pins.outputs.trivy }}

      - name: Bump pins
        id: bump
        run: ./tools/bump-scanners.sh
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_AGE_DAYS: '7'

      - name: Smoke-test the server image
        if: steps.bump.outputs.changed == 'true'
        run: |
          docker build -f packages/depinder-server/Dockerfile -t depinder-server:scanner-check .
          docker run --rm --entrypoint trivy depinder-server:scanner-check --version
          docker run --rm --entrypoint grype depinder-server:scanner-check version

      - name: Open PR
        id: pr
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.SCANNER_BOT_TOKEN }}
          branch: bot-scanner-update   # no "/": build.yml only runs on branches matching "*"
          delete-branch: true
          add-paths: |
            packages/depinder-core/src/vuln/scanner-versions.ts
            packages/depinder-server/Dockerfile
            packages/depinder-server/docs/configuration.md
            packages/depinder-server/docs/vuln-server.md
          commit-message: '[BOT] Bump pinned scanners: ${{ steps.bump.outputs.summary }}'
          title: '[BOT] Bump pinned scanners: ${{ steps.bump.outputs.summary }}'
          body: |
            ${{ steps.bump.outputs.summary }}

            ${{ steps.bump.outputs.notes }}

            - Newest stable releases at least 7 days old, or newer when that fixes a vulnerability of the pinned version.
            - Each image is pinned by digest only after the binary inside it (linux/amd64 and linux/arm64) matched the publisher's release binary, whose checksum file's Sigstore signature verified against the publisher's release workflow.
            - The server image builds and both scanners start in it.

            Merges itself when the required checks pass, unless the new version adds a HIGH/CRITICAL finding. Releases stay manual.

      - name: Report a blocked bump
        if: steps.pr.outputs.pull-request-number != '' && steps.bump.outputs.blocked == 'true'
        run: |
          gh pr merge --disable-auto "${{ steps.pr.outputs.pull-request-url }}" || true   # set by an earlier run
          echo "::warning::New HIGH/CRITICAL in the candidate; ${{ steps.pr.outputs.pull-request-url }} left for review"
        env:
          GH_TOKEN: ${{ secrets.SCANNER_BOT_TOKEN }}

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number != '' && steps.bump.outputs.blocked != 'true'
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-url }}"
        env:
          GH_TOKEN: ${{ secrets.SCANNER_BOT_TOKEN }}
